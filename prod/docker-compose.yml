version: '3'

services:
  payload:
    image: node:18-alpine
    #ports:
    #  - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    command: sh -c "yarn install && yarn dev"
    networks:
      - nginx
      - shared_postgres
    env_file:
      - .env

volumes:
  data:
  node_modules:

networks:
  nginx:
    external: true
  shared_postgres:
    external: true
